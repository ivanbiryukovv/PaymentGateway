name: Parallel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test ${{ matrix.configuration }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PaymentGateway.slnx

      - name: Build solution
        run: dotnet build PaymentGateway.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test PaymentGateway.slnx --configuration ${{ matrix.configuration }} --no-build
